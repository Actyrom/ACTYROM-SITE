name: Actyrom Site Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
          test -f llms.txt
          test -f assets/style.css
          test -f assets/app.js
          test -f assets/actyrom-expertise.webp
          test -f assets/actyrom-industrie.webp
          test -f assets/actyrom-habitat.webp
          test -f assets/actyrom-supervision.webp

      - name: Detect obvious broken local HTML links
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path(".")
          pages = list(root.glob("*.html"))
          missing = []

          for page in pages:
              text = page.read_text(encoding="utf-8", errors="ignore")
              for href in re.findall(r'href=["\']([^"\']+)["\']', text):
                  if href.startswith(("//","http://","https://","mailto:","tel:","#","javascript:")):
                      continue
                  target = href.split("#",1)[0].split("?",1)[0]
                  if not target:
                      continue
                  if not (root / target).exists():
                      missing.append(f"{page}: {href}")

          if missing:
              print("\n".join(missing))
              raise SystemExit("Broken local links detected")

          print(f"Checked {len(pages)} HTML pages: no obvious broken local links.")

      - name: Verify official Actyrom.fr references
        shell: python
        run: |
          from pathlib import Path

          forbidden = ("actyrom.github.io", "actyrom.com")
          errors = []

          if Path("CNAME").read_text(encoding="utf-8").strip().lower() != "actyrom.fr":
              errors.append("CNAME must contain actyrom.fr")

          for page in Path(".").glob("*.html"):
              text = page.read_text(encoding="utf-8", errors="ignore")
              lower = text.lower()

              if 'href="https://actyrom.fr/' not in text:
                  errors.append(f"{page}: missing official Actyrom.fr link")

              if page.name != "404.html":
                  if 'rel="canonical" href="https://actyrom.fr/' not in text:
                      errors.append(f"{page}: missing Actyrom.fr canonical")
                  if 'property="og:url" content="https://actyrom.fr/' not in text:
                      errors.append(f"{page}: missing Actyrom.fr Open Graph URL")

              for old_domain in forbidden:
                  if old_domain in lower:
                      errors.append(f"{page}: forbidden legacy domain {old_domain}")

          if errors:
              print("\n".join(errors))
              raise SystemExit("Official domain validation failed")

          print("Official domain references validated: https://actyrom.fr/")

      - name: Validate structured identity and local assets
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          errors = []
          required_identity = ("Actyrom Consulting", "513 784 363 00022", "Cahagnes")

          index = Path("index.html").read_text(encoding="utf-8")
          llms = Path("llms.txt").read_text(encoding="utf-8")
          for value in required_identity:
              if value not in index:
                  errors.append(f"index.html: missing identity value {value}")
              if value not in llms:
                  errors.append(f"llms.txt: missing identity value {value}")

          for page in Path(".").glob("*.html"):
              text = page.read_text(encoding="utf-8", errors="ignore")
              if "images.unsplash.com" in text:
                  errors.append(f"{page}: third-party image URL must be self-hosted")
              if 'href="connexion.html"' in text:
                  errors.append(f"{page}: unfinished client portal must not be promoted")
              if 'href="prestations-tarifs.html"' in text:
                  errors.append(f"{page}: retired duplicate tariff page must not be promoted")

              for photo in re.findall(
                  r"--(?:hero|card|panel)-photo:url\(['\"]?([^'\")]+)",
                  text,
              ):
                  if not photo.startswith("/assets/"):
                      errors.append(f"{page}: photo path must start with /assets/: {photo}")
                      continue
                  if not Path(photo.lstrip("/")).exists():
                      errors.append(f"{page}: missing local photo {photo}")

              for payload in re.findall(
                  r'<script type="application/ld\+json"[^>]*>(.*?)</script>',
                  text,
                  flags=re.DOTALL,
              ):
                  try:
                      json.loads(payload)
                  except json.JSONDecodeError as exc:
                      errors.append(f"{page}: invalid JSON-LD: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit("Structured identity validation failed")

          print("Structured identity and local assets validated.")
