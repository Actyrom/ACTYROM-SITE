name: Actyrom Site Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
          test -f llms.txt
          test -f plan-du-site.html
          test -f assets/style.css
          test -f assets/app.js
          test -f assets/actyrom-expertise.webp
          test -f assets/actyrom-industrie.webp
          test -f assets/actyrom-habitat.webp
          test -f assets/actyrom-supervision.webp

      - name: Detect obvious broken local HTML links
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path(".")
          pages = list(root.glob("*.html"))
          missing = []

          for page in pages:
              text = page.read_text(encoding="utf-8", errors="ignore")
              for href in re.findall(r'href=["\']([^"\']+)["\']', text):
                  if href.startswith(("//","http://","https://","mailto:","tel:","#","javascript:")):
                      continue
                  target = href.split("#",1)[0].split("?",1)[0]
                  if not target:
                      continue
                  if not (root / target).exists():
                      missing.append(f"{page}: {href}")

          if missing:
              print("\n".join(missing))
              raise SystemExit("Broken local links detected")

          print(f"Checked {len(pages)} HTML pages: no obvious broken local links.")

      - name: Verify official Actyrom.fr references
        shell: python
        run: |
          from pathlib import Path

          forbidden = ("actyrom.github.io", "actyrom.com")
          errors = []

          if Path("CNAME").read_text(encoding="utf-8").strip().lower() != "actyrom.fr":
              errors.append("CNAME must contain actyrom.fr")

          for page in Path(".").glob("*.html"):
              text = page.read_text(encoding="utf-8", errors="ignore")
              lower = text.lower()

              if 'href="https://actyrom.fr/' not in text:
                  errors.append(f"{page}: missing official Actyrom.fr link")

              if page.name != "404.html":
                  if 'rel="canonical" href="https://actyrom.fr/' not in text:
                      errors.append(f"{page}: missing Actyrom.fr canonical")
                  if 'property="og:url" content="https://actyrom.fr/' not in text:
                      errors.append(f"{page}: missing Actyrom.fr Open Graph URL")

              for old_domain in forbidden:
                  if old_domain in lower:
                      errors.append(f"{page}: forbidden legacy domain {old_domain}")

          if errors:
              print("\n".join(errors))
              raise SystemExit("Official domain validation failed")

          print("Official domain references validated: https://actyrom.fr/")

      - name: Validate crawl discovery
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urljoin
          import re
          import xml.etree.ElementTree as ET

          root = Path(".")
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          sitemap = ET.parse("sitemap.xml").getroot()
          sitemap_urls = [
              node.text.strip()
              for node in sitemap.findall(".//sm:loc", namespace)
              if node.text and node.text.strip()
          ]
          errors = []

          if len(sitemap_urls) != len(set(sitemap_urls)):
              errors.append("sitemap.xml: duplicate URL")

          for url in sitemap_urls:
              if not url.startswith("https://actyrom.fr/"):
                  errors.append(f"sitemap.xml: non-official URL {url}")
                  continue
              relative = url.removeprefix("https://actyrom.fr/")
              target = root / (relative or "index.html")
              if not target.is_file():
                  errors.append(f"sitemap.xml: missing local target for {url}")

          indexable_urls = set()
          for page in root.glob("*.html"):
              text = page.read_text(encoding="utf-8", errors="ignore")
              if page.name == "404.html" or re.search(
                  r'<meta\s+name=["\']robots["\']\s+content=["\'][^"\']*noindex',
                  text,
                  flags=re.IGNORECASE,
              ):
                  continue
              canonical = re.search(
                  r'<link\s+rel=["\']canonical["\']\s+href=["\']([^"\']+)',
                  text,
                  flags=re.IGNORECASE,
              )
              if not canonical:
                  errors.append(f"{page}: missing canonical URL")
                  continue
              indexable_urls.add(canonical.group(1))
              if 'href="plan-du-site.html"' not in text:
                  errors.append(f"{page}: missing HTML sitemap link")

          if set(sitemap_urls) != indexable_urls:
              missing = sorted(indexable_urls - set(sitemap_urls))
              extra = sorted(set(sitemap_urls) - indexable_urls)
              if missing:
                  errors.append(f"sitemap.xml: missing indexable URLs: {missing}")
              if extra:
                  errors.append(f"sitemap.xml: non-indexable URLs: {extra}")

          plan_text = Path("plan-du-site.html").read_text(encoding="utf-8")
          plan_links = {
              urljoin("https://actyrom.fr/plan-du-site.html", href.split("#", 1)[0])
              for href in re.findall(r'href=["\']([^"\']+)["\']', plan_text)
          }
          for url in sitemap_urls:
              if url not in plan_links:
                  errors.append(f"plan-du-site.html: missing link to {url}")

          robots = Path("robots.txt").read_text(encoding="utf-8")
          if "Sitemap: https://actyrom.fr/sitemap.xml" not in robots:
              errors.append("robots.txt: missing official sitemap declaration")

          if errors:
              print("\n".join(errors))
              raise SystemExit("Crawl discovery validation failed")

          print(f"Validated {len(sitemap_urls)} indexable URLs and their discovery links.")

      - name: Validate structured identity and local assets
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          errors = []
          required_identity = ("Actyrom Consulting", "513 784 363 00022", "Cahagnes")

          index = Path("index.html").read_text(encoding="utf-8")
          llms = Path("llms.txt").read_text(encoding="utf-8")
          for value in required_identity:
              if value not in index:
                  errors.append(f"index.html: missing identity value {value}")
              if value not in llms:
                  errors.append(f"llms.txt: missing identity value {value}")

          for page in Path(".").glob("*.html"):
              text = page.read_text(encoding="utf-8", errors="ignore")
              if "images.unsplash.com" in text:
                  errors.append(f"{page}: third-party image URL must be self-hosted")
              if 'href="connexion.html"' in text:
                  errors.append(f"{page}: unfinished client portal must not be promoted")
              if 'href="prestations-tarifs.html"' in text:
                  errors.append(f"{page}: retired duplicate tariff page must not be promoted")

              if page.name != "404.html":
                  title = re.search(r"<title>(.*?)</title>", text, flags=re.DOTALL)
                  description = re.search(
                      r'<meta\s+name=["\']description["\']\s+content=["\']([^"\']+)',
                      text,
                      flags=re.IGNORECASE,
                  )
                  hero_label = re.search(
                      r'<div\s+class=["\']hero-label["\']>(.*?)</div>',
                      text,
                      flags=re.DOTALL | re.IGNORECASE,
                  )
                  social_values = {
                      "Open Graph title": re.search(
                          r'<meta\s+property=["\']og:title["\']\s+content=["\']([^"\']+)',
                          text,
                          flags=re.IGNORECASE,
                      ),
                      "Open Graph description": re.search(
                          r'<meta\s+property=["\']og:description["\']\s+content=["\']([^"\']+)',
                          text,
                          flags=re.IGNORECASE,
                      ),
                      "Twitter title": re.search(
                          r'<meta\s+name=["\']twitter:title["\']\s+content=["\']([^"\']+)',
                          text,
                          flags=re.IGNORECASE,
                      ),
                      "Twitter description": re.search(
                          r'<meta\s+name=["\']twitter:description["\']\s+content=["\']([^"\']+)',
                          text,
                          flags=re.IGNORECASE,
                      ),
                  }

                  if not title or "Actyrom Consulting" not in title.group(1):
                      errors.append(f"{page}: title must name Actyrom Consulting")
                  if not description or "Actyrom Consulting" not in description.group(1):
                      errors.append(f"{page}: description must name Actyrom Consulting")
                  if not hero_label or "ACTYROM CONSULTING" not in hero_label.group(1):
                      errors.append(f"{page}: hero label must name ACTYROM CONSULTING")
                  if '"name": "Actyrom Consulting"' not in text:
                      errors.append(f"{page}: structured data must name Actyrom Consulting")
                  for label, match in social_values.items():
                      if not match or "Actyrom Consulting" not in match.group(1):
                          errors.append(f"{page}: {label} must name Actyrom Consulting")

              for photo in re.findall(
                  r"--(?:hero|card|panel)-photo:url\(['\"]?([^'\")]+)",
                  text,
              ):
                  if not photo.startswith("/assets/"):
                      errors.append(f"{page}: photo path must start with /assets/: {photo}")
                      continue
                  if not Path(photo.lstrip("/")).exists():
                      errors.append(f"{page}: missing local photo {photo}")

              for payload in re.findall(
                  r'<script type="application/ld\+json"[^>]*>(.*?)</script>',
                  text,
                  flags=re.DOTALL,
              ):
                  try:
                      json.loads(payload)
                  except json.JSONDecodeError as exc:
                      errors.append(f"{page}: invalid JSON-LD: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit("Structured identity validation failed")

          print("Structured identity and local assets validated.")
